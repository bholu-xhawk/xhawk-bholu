name: Node CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
      - name: Run start script
        run: npm run start
      - name: Run tests
        run: npm test
      - name: Install web dependencies
        run: if [ -f apps/web/package-lock.json ]; then npm --prefix apps/web ci --no-fund --no-audit; else npm --prefix apps/web install --no-fund --no-audit; fi
      - name: Build web app
        run: npm --prefix apps/web run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run web E2E tests
        run: npm --prefix apps/web run test:e2e
